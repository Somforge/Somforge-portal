<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SOMFORGE</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        h1 {
            color: #102b4e;
            margin-top: 0;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #102b4e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        a {
            color: #102b4e;
            font-weight: bold;
            text-decoration: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Forgot Password?</h1>

    <p>Enter the email address associated with your SOMFORGE account. We'll send you instructions to reset your password.</p>

    <form id="resetForm">
        <input
            type="email"
            id="email"
            placeholder="Your email address"
            required
        >

        <button type="submit" id="submitButton">
            Send Reset Link
        </button>
    </form>

    <p id="message" role="status"></p>

    <a class="back" href="login.html">Back to Login</a>
</div>

<script>
    const SUPABASE_URL = "https://dfgaywdtxpajsqitaszy.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_qbKofq4A0gD4-b7X4Hy6ew_ptyv1lyt";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    document.getElementById("resetForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const button = document.getElementById("submitButton");
        const message = document.getElementById("message");

        button.disabled = true;
        button.textContent = "Sending...";
        message.textContent = "";

        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + "/Somforge-portal/reset-password.html"
        });

        if (error) {
            message.style.color = "#b91c1c";
            message.textContent = error.message;
        } else {
            message.style.color = "#15803d";
            message.textContent =
                "If an account exists for that email, a password reset link will be sent. Please check your inbox.";
        }

        button.disabled = false;
        button.textContent = "Send Reset Link";
    });
</script>

</body>
</html>

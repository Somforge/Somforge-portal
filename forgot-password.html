<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SOMFORGE</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        h1 {
            color: #102b4e;
            margin-top: 0;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #102b4e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        a {
            color: #102b4e;
            font-weight: bold;
            text-decoration: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
        }
    </style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><style>
:root{--navy:#101f31;--gold:#c5a166;--paper:#f6f3ed;--line:#e4ded3}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:#18283a}.box{max-width:470px;padding:42px;background:#fff;border:1px solid var(--line);border-radius:0;box-shadow:0 22px 65px rgba(16,31,49,.09)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:34px;text-decoration:none;color:var(--navy);font-weight:700;letter-spacing:2.4px}.brand img{width:44px;height:48px;object-fit:contain}.brand span{font-size:18px}
h1{font:500 36px 'Playfair Display',Georgia,serif;color:var(--navy)}p{font-size:14px;line-height:1.8;color:#687582}
input{height:49px;border-radius:0;border-color:var(--line);font:14px 'DM Sans',sans-serif}button{height:50px;border-radius:0;background:var(--navy);font:700 11px 'DM Sans',sans-serif;letter-spacing:1px;text-transform:uppercase}a{color:#98713f}.back{font-size:13px}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style></head>

<body>

<div class="box"><a class="brand" href="index.html"><img src="/Somforge-portal/assets/somforge-emblem.svg" alt=""><span>SOMFORGE</span></a>
    <h1>Forgot Password?</h1>

    <p>Enter the email address associated with your SOMFORGE account. We'll send you instructions to reset your password.</p>

    <form id="resetForm">
        <input
            type="email"
            id="email"
            placeholder="Your email address"
            required
        >

        <button type="submit" id="submitButton">
            Send Reset Link
        </button>
    </form>

    <p id="message" role="status"></p>

    <a class="back" href="login.html">Back to Login</a>
</div>

<script>
    const SUPABASE_URL = "https://dfgaywdtxpajsqitaszy.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_qbKofq4A0gD4-b7X4Hy6ew_ptyv1lyt";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    document.getElementById("resetForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim().toLowerCase();
        const button = document.getElementById("submitButton");
        const message = document.getElementById("message");

        button.disabled = true;
        button.textContent = "Sending...";
        message.textContent = "";

        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + "/Somforge-portal/reset-password.html"
        });

        if (error) {
            message.style.color = "#b91c1c";
            message.textContent = error.message;
        } else {
            message.style.color = "#15803d";
            message.textContent =
                "If an account exists for that email, a password reset link will be sent. Please check your inbox.";
        }

        button.disabled = false;
        button.textContent = "Send Reset Link";
    });
</script>

</body>
</html>

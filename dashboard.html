<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | SOMFORGE</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #102b4e;
            color: white;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .logo span {
            color: #d6a63c;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 10px 17px;
            cursor: pointer;
            font-weight: bold;
        }

        #logoutButton {
            background: #d6a63c;
            color: #102b4e;
        }

        main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .welcome {
            background: white;
            padding: 28px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.04);
        }

        .welcome h1 {
            color: #102b4e;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #64748b;
            line-height: 1.6;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.04);
        }

        .card h3 {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .card p {
            color: #102b4e;
            font-size: 21px;
            font-weight: bold;
        }

        .notice {
            background: white;
            padding: 25px;
            border-radius: 12px;
            line-height: 1.7;
        }

        .notice h2 {
            color: #102b4e;
            margin-bottom: 10px;
        }

        #message {
            margin-top: 20px;
            color: #64748b;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 500px) {
            header {
                padding: 17px;
            }

            .logo {
                font-size: 19px;
            }

            main {
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">SOM<span>FORGE</span></div>
    <button id="logoutButton">Log Out</button>
</header>

<main>

    <section class="welcome">
        <h1 id="welcomeMessage">Welcome to SOMFORGE</h1>
        <p>Your learning journey starts here. Access your academic resources from one place.</p>
    </section>

    <section class="cards">
        <div class="card">
            <h3>Academic Year</h3>
            <p id="year">Loading...</p>
        </div>

        <div class="card">
            <h3>Account Status</h3>
            <p id="accountStatus">Loading...</p>
        </div>

        <div class="card">
            <h3>Subscription</h3>
            <p id="subscriptionStatus">Loading...</p>
        </div>
    </section>

    <section class="notice">
        <h2>Your Learning Portal</h2>
        <p id="accessMessage">Checking your account and subscription...</p>
        <p id="message"></p>
    </section>

</main>

<script>
    const SUPABASE_URL = "https://dfgaywdtxpajsqitaszy.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_qbKofq4A0gD4-b7X4Hy6ew_ptyv1lyt";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    async function loadDashboard() {
        const welcomeMessage = document.getElementById("welcomeMessage");
        const yearElement = document.getElementById("year");
        const accountElement = document.getElementById("accountStatus");
        const subscriptionElement = document.getElementById("subscriptionStatus");
        const accessMessage = document.getElementById("accessMessage");
        const message = document.getElementById("message");

        const { data: authData, error: authError } =
            await supabaseClient.auth.getUser();

        if (authError || !authData.user) {
            window.location.href = "login.html";
            return;
        }

        const user = authData.user;

        const { data: profile, error: profileError } =
            await supabaseClient
                .from("profiles")
                .select("full_name, year_level, account_status")
                .eq("id", user.id)
                .single();

        if (profileError || !profile) {
            accessMessage.textContent =
                "We could not find your student profile. Please contact the administrator.";
            message.textContent = profileError ? profileError.message : "";
            return;
        }

        welcomeMessage.textContent = "Welcome, " + profile.full_name + "!";
        yearElement.textContent = profile.year_level || "Not assigned";
        accountElement.textContent = profile.account_status || "Unknown";

        if (profile.account_status !== "approved") {
            subscriptionElement.textContent = "Unavailable";
            accessMessage.textContent =
                "Your account is awaiting administrator approval. Please check again later.";
            return;
        }

        const { data: subscriptions, error: subscriptionError } =
            await supabaseClient
                .from("subscriptions")
                .select("status, start_date, end_date")
                .eq("student_id", user.id)
                .order("end_date", { ascending: false })
                .limit(1);

        if (subscriptionError) {
            subscriptionElement.textContent = "Unable to check";
            accessMessage.textContent =
                "We could not verify your subscription. Please contact the administrator.";
            message.textContent = subscriptionError.message;
            return;
        }

        const subscription = subscriptions && subscriptions.length
            ? subscriptions[0]
            : null;

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const endDate = subscription && subscription.end_date
            ? new Date(subscription.end_date + "T23:59:59")
            : null;

        const active = subscription &&
            subscription.status === "active" &&
            endDate &&
            endDate >= today;

        if (active) {
            subscriptionElement.textContent = "Active";
            accessMessage.textContent =
                "Your account is approved and your subscription is active. Your learning resources will appear here once they are connected.";
        } else {
            subscriptionElement.textContent = "Inactive";
            accessMessage.textContent =
                "Your account is approved, but you do not currently have an active subscription. Please contact the administrator about activation or renewal.";
        }
    }

    document.getElementById("logoutButton").addEventListener("click", async function() {
        await supabaseClient.auth.signOut();
        window.location.href = "login.html";
    });

    loadDashboard();
</script>

</body>
</html>

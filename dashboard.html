<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | SOMFORGE</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #102b4e;
            color: white;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .logo span {
            color: #d6a63c;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 11px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        #logoutButton {
            background: #d6a63c;
            color: #102b4e;
        }

        main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .welcome, .card, .notice {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.04);
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1, .notice h2 {
            color: #102b4e;
            margin-bottom: 10px;
        }

        .welcome p, .notice p {
            color: #64748b;
            line-height: 1.7;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card h3 {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .card p {
            color: #102b4e;
            font-size: 20px;
            font-weight: bold;
        }

        #message {
            margin-top: 12px;
            color: #b91c1c;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            header {
                padding: 17px;
            }

            .logo {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">SOM<span>FORGE</span></div>
    <button id="logoutButton">Log Out</button>
</header>

<main>

    <section class="welcome">
        <h1 id="welcomeMessage">Welcome to SOMFORGE</h1>
        <p>Your learning journey starts here. Access your academic resources from one place.</p>
    </section>

    <section class="cards">

        <div class="card">
            <h3>Academic Year</h3>
            <p id="year">Loading...</p>
        </div>

        <div class="card">
            <h3>Account Status</h3>
            <p id="accountStatus">Loading...</p>
        </div>

        <div class="card">
            <h3>Subscription</h3>
            <p id="subscriptionStatus">Loading...</p>
        </div>

    </section>

    <section class="notice">
        <h2>Your Learning Portal</h2>
        <p id="accessMessage">Checking your account...</p>
        <p id="message"></p>
    </section>

</main>

<script>
    const SUPABASE_URL = "https://dfgaywdtxpajsqitaszy.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_qbKofq4A0gD4-b7X4Hy6ew_ptyv1lyt";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    async function loadDashboard() {

        const welcome = document.getElementById("welcomeMessage");
        const year = document.getElementById("year");
        const account = document.getElementById("accountStatus");
        const subscriptionStatus = document.getElementById("subscriptionStatus");
        const accessMessage = document.getElementById("accessMessage");
        const message = document.getElementById("message");

        // Check whether a student is signed in.
        const { data: authData, error: authError } =
            await supabaseClient.auth.getUser();

        if (authError || !authData.user) {
            window.location.replace("login.html");
            return;
        }

        const user = authData.user;

        // Retrieve the student's profile.
        const { data: profile, error: profileError } =
            await supabaseClient
                .from("profiles")
                .select("full_name, year_level, account_status")
                .eq("id", user.id)
                .single();

        if (profileError || !profile) {
            accessMessage.textContent =
                "Your student profile could not be retrieved. Please contact the administrator.";

            message.textContent = profileError
                ? profileError.message
                : "Profile not found.";

            return;
        }

        welcome.textContent = "Welcome, " + profile.full_name + "!";
        year.textContent = profile.year_level || "Not assigned";
        account.textContent = profile.account_status || "Unknown";

        // Only approved accounts can proceed.
        if (profile.account_status !== "approved") {
            subscriptionStatus.textContent = "Unavailable";

            accessMessage.textContent =
                "Your account is awaiting administrator approval. Please contact the administrator if you need assistance.";

            return;
        }

        // Retrieve the student's subscriptions.
        const { data: subscriptions, error: subscriptionError } =
            await supabaseClient
                .from("subscriptions")
                .select("status, start_date, end_date")
                .eq("student_id", user.id)
                .order("end_date", { ascending: false });

        if (subscriptionError) {
            subscriptionStatus.textContent = "Unable to check";

            accessMessage.textContent =
                "We could not verify your subscription. Please contact the administrator.";

            message.textContent = subscriptionError.message;
            return;
        }

        // Check whether at least one subscription is currently valid.
        const now = new Date();

        const activeSubscription = (subscriptions || []).find(sub => {

            if (sub.status !== "active" || !sub.start_date || !sub.end_date) {
                return false;
            }

            const startDate = new Date(sub.start_date);
            const endDate = new Date(sub.end_date);

            return startDate <= now && endDate >= now;
        });

        if (activeSubscription) {

            subscriptionStatus.textContent = "Active";

            accessMessage.textContent =
                "Your account is approved and your subscription is active. Your learning resources will appear here once they are connected.";

        } else {

            subscriptionStatus.textContent = "Inactive";

            accessMessage.textContent =
                "Your account is approved, but you do not currently have an active subscription. Please contact the administrator about activation or renewal.";

        }
    }

    document.getElementById("logoutButton").addEventListener("click", async function() {

        await supabaseClient.auth.signOut();

        window.location.replace("login.html");

    });

    loadDashboard();
</script>

</body>
</html>

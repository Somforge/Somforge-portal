<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SOMFORGE</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        h1 { color: #102b4e; }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 15px;
            color: #334155;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #102b4e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            margin-top: 15px;
            overflow-wrap: anywhere;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #102b4e;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Reset Your Password</h1>

    <p>Enter and confirm your new SOMFORGE account password below.</p>

    <form id="resetForm">

        <label for="password">New Password</label>
        <input
            type="password"
            id="password"
            minlength="8"
            placeholder="At least 8 characters"
            required
        >

        <label for="confirmPassword">Confirm New Password</label>
        <input
            type="password"
            id="confirmPassword"
            minlength="8"
            placeholder="Enter your password again"
            required
        >

        <button type="submit" id="submitButton">
            Update Password
        </button>

    </form>

    <p id="message" role="status"></p>

    <a href="login.html">Back to Login</a>
</div>

<script>
    const SUPABASE_URL = "https://dfgaywdtxpajsqitaszy.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_qbKofq4A0gD4-b7X4Hy6ew_ptyv1lyt";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("resetForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        message.textContent = "";

        if (password.length < 8) {
            message.style.color = "#b91c1c";
            message.textContent = "Your password must contain at least 8 characters.";
            return;
        }

        if (password !== confirmPassword) {
            message.style.color = "#b91c1c";
            message.textContent = "The passwords do not match.";
            return;
        }

        button.disabled = true;
        button.textContent = "Updating...";

        const { data: sessionData, error: sessionError } =
            await supabaseClient.auth.getSession();

        if (sessionError || !sessionData.session) {
            message.style.color = "#b91c1c";
            message.textContent =
                "Your reset link is invalid or has expired. Please request another reset link.";

            button.disabled = false;
            button.textContent = "Update Password";
            return;
        }

        const { error } = await supabaseClient.auth.updateUser({
            password: password
        });

        if (error) {
            message.style.color = "#b91c1c";
            message.textContent = error.message;

            button.disabled = false;
            button.textContent = "Update Password";
            return;
        }

        message.style.color = "#15803d";
        message.textContent =
            "Your password has been updated successfully. You can now log in using your new password.";

        form.reset();
        button.textContent = "Password Updated";
    });
</script>

</body>
</html>
